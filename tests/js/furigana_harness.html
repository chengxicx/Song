<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>furigana harness</title>
<script>
  // Reading-page config, normally injected by read/index.html.
  window.LUTE_FURIGANA = { enabled: true, langId: 9 };
  // htmx present so lute-furigana.js registers its afterSwap listener.
  window.htmx = {};
  // Stub the readings endpoint.  The delay matters: the real fetch is
  // async, and the reading page calls annotate() from three entry points
  // back-to-back on the initial load (DOMContentLoaded, htmx:afterSwap,
  // page_content's explicit call) -- the responses must be able to
  // resolve after all of them have run.
  window.__fetch_calls = 0;
  window.__fetch_fail = false;
  window.__READINGS = {
    "音": "おと",
    "夜": "よる",
    "聞こえ": "きこえ",
    "カサカサ": "かさかさ",
    "わたし": "わたし",
  };
  window.fetch = function (url, opts) {
    window.__fetch_calls++;
    const body = JSON.parse(opts.body);
    const fail = window.__fetch_fail;
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        if (fail) {
          reject(new Error("network down"));
          return;
        }
        const tokens = body.tokens.map(function (t) {
          return { text: t, reading: window.__READINGS[t] || null };
        });
        resolve({
          ok: true,
          json: function () { return Promise.resolve({ tokens: tokens }); },
        });
      }, 150);
    });
  };
</script>
</head>
<body>
<div id="thetext">
  <p>
    <span class="textsentence" id="sent_1">
      <span class="textitem click word" data-paragraph-id="1" data-sentence-id="1" data-text="音">音</span>
      <span class="textitem click word" data-paragraph-id="1" data-sentence-id="1" data-text="カサカサ">カサカサ</span>
      <span class="textitem">が</span>
      <span class="textitem click word" data-paragraph-id="1" data-sentence-id="1" data-text="聞こえ">聞こえ</span>
      <span class="textitem">ました</span>
    </span>
  </p>
  <p>
    <span class="textsentence" id="sent_2">
      <span class="textitem click word" data-paragraph-id="2" data-sentence-id="2" data-text="夜">夜</span>
      <span class="textitem click word" data-paragraph-id="2" data-sentence-id="2" data-text="わたし">わたし</span>
    </span>
  </p>
</div>
<script src="../../lute/static/js/lute-furigana.js"></script>
</body>
</html>
