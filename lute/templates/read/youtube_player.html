<div class="youtube-player-container" id="yt-player-container">
  <script type="text/javascript">
    window.LUTE_YT_DATA = window.LUTE_YT_DATA || {};
    window.LUTE_YT_DATA.videoId = {{ youtube_video_id | tojson }};
    window.LUTE_YT_DATA.audioUrl = {{ mp3_audio_url | tojson }};
    window.LUTE_YT_DATA.backend = {{ media_backend | tojson }};
    window.LUTE_YT_DATA.cues = {{ srt_cues_json | safe }};
    window.LUTE_YT_DATA.words = {{ srt_words_json | safe }};
    window.LUTE_YT_DATA.bookId = {{ book.id }};
    window.LUTE_YT_DATA.startPos = {{ video_current_pos }};
    window.LUTE_YT_DATA.langId = {{ lang_id }};

    // Define the IFrame API callback before the api script loads, and
    // queue any callbacks registered after it has already loaded.
    // Only used for YouTube books; for MP3/video books the api script
    // is not loaded at all.
    window.YT_READY_CALLBACKS = window.YT_READY_CALLBACKS || [];
    window.onYouTubeIframeAPIReady = function () {
      window.YT_IS_READY = true;
      (window.YT_READY_CALLBACKS || []).forEach(function (cb) {
        try { cb(); } catch (e) { console.error(e); }
      });
      window.YT_READY_CALLBACKS = [];
    };
  </script>
  {% if book_type == "youtube" %}
  <script type="text/javascript" src="https://www.youtube.com/iframe_api" async></script>

  <div class="yt-player-video-wrap">
    <div id="yt-player"></div>
    <div class="yt-player-loading" id="yt-player-loading">Loading player...</div>
  </div>
  {% elif book_type == "video" %}
  {# Online video book: render an HTML5 <video> element instead of the
     YouTube iframe.  The unified player drives it via the media backend. #}
  <div class="yt-player-video-wrap">
    <video id="yt-video-player" preload="metadata" playsinline
           src="{{ mp3_audio_url or '' }}"></video>
    <div class="yt-player-loading" id="yt-player-loading">Loading video...</div>
  </div>
  {% else %}
  {# MP3 audio book: render an HTML5 audio element instead of the YouTube iframe. #}
  <div class="yt-player-audio-wrap">
    <audio id="yt-audio-player" preload="metadata" src="{{ mp3_audio_url or '' }}"></audio>
    <div class="yt-player-loading" id="yt-player-loading" style="display: none;">Loading audio...</div>
  </div>
  {% endif %}

  <div class="yt-player-controls">
    <div class="yt-controls-left">
      <button id="yt-prev-cue-btn" class="audio-button yt-cue-btn" title="Previous subtitle">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M7 6h2v12H7zM20 6l-8.5 6 8.5 6z"></path></svg>
      </button>
      <button id="yt-play-btn" class="audio-button yt-play-btn" title="Play / pause">
        <svg viewBox="0 0 24 24" class="yt-icn yt-icn-play"><path d="M8 5v14l11-7z"></path></svg>
        <svg viewBox="0 0 24 24" class="yt-icn yt-icn-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
      </button>
      <button id="yt-next-cue-btn" class="audio-button yt-cue-btn" title="Next subtitle">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M15 6h2v12h-2zM4 6l8.5 6L4 18z"></path></svg>
      </button>
    </div>
    <div class="yt-timeline-wrap">
      <input type="range" class="yt-timeline" id="yt-timeline" max="1000" value="0" step="0.1" />
      <div class="yt-time-display">
        <span id="yt-current-time">0:00</span>
        <span>/</span>
        <span id="yt-duration">0:00</span>
      </div>
    </div>
    <div class="yt-controls-right">
      {% if book_type in ["video", "youtube"] %}
      <div class="yt-settings-wrap">
        <button id="yt-settings-btn" class="audio-button yt-cue-btn yt-settings-btn" type="button" title="Settings">
          <svg viewBox="0 0 24 24" class="yt-icn"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"></path></svg>
        </button>
        <div id="yt-settings-dropdown" class="yt-settings-dropdown" hidden>
          <label class="yt-settings-option" title="Hide the video and read with just the audio track">
            <input type="checkbox" id="yt-audio-mode-cb">
            <span>Audio only</span>
          </label>
        </div>
      </div>
      {% endif %}
      <div id="yt-playback-rate-container" title="Playback rate. Click the number to reset">
        <button id="yt-rate-dec" class="audio-button yt-rate-btn"><span>−</span></button>
        <div id="yt-rate-indicator">1</div>
        <button id="yt-rate-inc" class="audio-button yt-rate-btn"><span>+</span></button>
      </div>
      <button id="yt-loop-btn" class="yt-toggle-btn" title="Loop current sentence">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
        <span class="yt-toggle-label">Loop</span>
      </button>
      <button id="yt-autopause-btn" class="yt-toggle-btn" title="Auto-pause at the end of each sentence">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"></path><path d="M9 9h2v6H9zM13 9h2v6h-2z"></path></svg>
        <span class="yt-toggle-label">Auto-pause</span>
      </button>
      {% if book_type == "youtube" %}
      <button id="yt-fullscreen-btn" class="yt-toggle-btn" title="Fullscreen">
        <svg viewBox="0 0 24 24" class="yt-icn yt-icn-expand"><path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path></svg>
        <svg viewBox="0 0 24 24" class="yt-icn yt-icn-collapse"><path d="M9 4v5H4"></path><path d="M15 4v5h5"></path><path d="M9 20v-5H4"></path><path d="M15 20v-5h5"></path></svg>
      </button>
      {% endif %}
      <button id="yt-transcript-btn" class="yt-transcript-btn">Transcript</button>
    </div>
    {# Mobile bottom mini-player expand chevron (player-dock.js); hidden
       on desktop via CSS. #}
    <button type="button" class="player-expand-btn" title="Expand player" aria-label="Expand player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
    </button>
  </div>

  <div class="yt-scrolling-subtitle" id="yt-scrolling-subtitle">
    <div class="yt-scrolling-subtitle-inner" id="yt-scrolling-subtitle-inner" dir="{{ 'rtl' if is_rtl else 'ltr' }}"></div>
  </div>

  <div class="yt-transcript" id="yt-transcript" style="display: none">
    <div class="yt-transcript-list" id="yt-transcript-list"></div>
  </div>
</div>
