<div class="youtube-player-container" id="yt-player-container">
  <script type="text/javascript">
    window.LUTE_YT_DATA = window.LUTE_YT_DATA || {};
    window.LUTE_YT_DATA.bilibiliUrl = {{ bilibili_url | tojson }};
    window.LUTE_YT_DATA.audioUrl = null;
    window.LUTE_YT_DATA.cues = {{ srt_cues_json | safe }};
    window.LUTE_YT_DATA.words = {{ srt_words_json | safe }};
    window.LUTE_YT_DATA.bookId = {{ book.id }};
    window.LUTE_YT_DATA.startPos = {{ video_current_pos }};
    window.LUTE_YT_DATA.langId = {{ lang_id }};
  </script>

  <div class="yt-player-video-wrap">
    <iframe id="bili-player" class="bili-player-frame"
            src="{{ bilibili_url or '' }}"
            allowfullscreen="allowfullscreen"
            scrolling="no"
            frameborder="no"
            loading="lazy"></iframe>
    <div class="yt-player-loading" id="yt-player-loading">Loading player...</div>
  </div>

  <div class="yt-player-controls">
    <div class="yt-controls-left">
      <button id="yt-prev-cue-btn" class="audio-button yt-cue-btn" title="Previous subtitle">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M7 6h2v12H7zM20 6l-8.5 6 8.5 6z"></path></svg>
      </button>
      <button id="yt-play-btn" class="audio-button yt-play-btn" title="Play / pause">
        <svg viewBox="0 0 24 24" class="yt-icn yt-icn-play"><path d="M8 5v14l11-7z"></path></svg>
        <svg viewBox="0 0 24 24" class="yt-icn yt-icn-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
      </button>
      <button id="yt-next-cue-btn" class="audio-button yt-cue-btn" title="Next subtitle">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M15 6h2v12h-2zM4 6l8.5 6L4 18z"></path></svg>
      </button>
    </div>
    <div class="yt-timeline-wrap">
      <input type="range" class="yt-timeline" id="yt-timeline" max="1000" value="0" step="0.1" />
      <div class="yt-time-display">
        <span id="yt-current-time">0:00</span>
        <span>/</span>
        <span id="yt-duration">0:00</span>
      </div>
    </div>
    <div class="yt-controls-right">
      <div id="yt-playback-rate-container" title="Playback rate. Click the number to reset">
        <button id="yt-rate-dec" class="audio-button yt-rate-btn"><span>−</span></button>
        <div id="yt-rate-indicator">1</div>
        <button id="yt-rate-inc" class="audio-button yt-rate-btn"><span>+</span></button>
      </div>
      <button id="yt-loop-btn" class="yt-toggle-btn" title="Loop current sentence">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
        <span class="yt-toggle-label">Loop</span>
      </button>
      <button id="yt-autopause-btn" class="yt-toggle-btn" title="Auto-pause at the end of each sentence">
        <svg viewBox="0 0 24 24" class="yt-icn"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"></path><path d="M9 9h2v6H9zM13 9h2v6h-2z"></path></svg>
        <span class="yt-toggle-label">Auto-pause</span>
      </button>
      <button id="yt-transcript-btn" class="yt-transcript-btn">Transcript</button>
    </div>
  </div>

  <div class="yt-scrolling-subtitle" id="yt-scrolling-subtitle">
    <div class="yt-scrolling-subtitle-inner" id="yt-scrolling-subtitle-inner" dir="{{ 'rtl' if is_rtl else 'ltr' }}"></div>
  </div>

  <div class="yt-transcript" id="yt-transcript" style="display: none">
    <div class="yt-transcript-list" id="yt-transcript-list"></div>
  </div>
</div>
