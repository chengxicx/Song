{% extends 'base.html' %}

{% block title %}Review session{% endblock %}
{% block header %}Review{% endblock %}

{% block body %}

<div id="review_session_container">
  <div class="rv-topbar">
    <div id="review_progress" class="rv-progress"></div>
    <button class="btn btn-secondary" id="review_undo" hidden>Undo <kbd>Ctrl+Z</kbd></button>
  </div>
  <div id="review_card"></div>
</div>

<div id="review_session_error" class="rv-error" style="display: none;"></div>

<script>
  // Everything on this page is built by lute-review.js, so a script
  // that never arrived used to leave nothing but the (hidden) Undo
  // button on screen.  Try loading it by hand once before giving up --
  // that recovers a cached or dropped request -- and when it still
  // fails, say what actually happened instead of just "did not load".
  (function () {
    const SRC = "{{ vstatic_js('lute-review.js') | safe }}";

    function fail(detail) {
      const box = document.getElementById("review_session_error");
      const btn = document.getElementById("review_undo");
      if (btn) btn.hidden = true;
      if (!box) return;
      box.style.display = "block";
      box.innerHTML =
        "<p>The review script did not load, so the session cannot start.</p>" +
        "<p class='rv-detail'>" + detail + "</p>" +
        "<p>Reload the page (a hard reload clears a stale cache).</p>" +
        "<p><a href='/review/index'>Back to review index</a></p>";
    }

    function rescue() {
      const s = document.createElement("script");
      s.src = SRC;
      s.onload = () => {
        if (typeof LuteReview === "undefined") {
          fail(SRC + " loaded but did not define LuteReview");
          return;
        }
        LuteReview.start_session();
      };
      // onload/onerror give no status, so ask separately: a 404 and a
      // blocked request are very different problems.
      s.onerror = () =>
        fetch(SRC)
          .then((r) => fail("HTTP " + r.status + " for " + SRC))
          .catch(() => fail("network error fetching " + SRC));
      document.head.appendChild(s);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof LuteReview !== "undefined") {
        LuteReview.start_session();
        return;
      }
      rescue();
    });
  })();
</script>

{% endblock %}
