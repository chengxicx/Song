<!-- The default language selector.  This is moved into the datatables toolbar during setup. -->
<select id="defaultLanguageSelect" class="dataTables_filter" title="Default language">
  {% for lang_choice in language_choices %}
    <option value="{{ lang_choice[0] }}">{{ lang_choice[1] }}</option>
  {% endfor %}
</select>

<table id="booktable" class="table dataTable stripe">
  <thead>
    <tr>
      <th style="text-align: left">Title
        <a class="series-settings-gear" href="/book/settings" title="Configure book series tags" onclick="event.stopPropagation();">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <line x1="10" y1="9" x2="16" y2="9"></line>
            <line x1="10" y1="12" x2="16" y2="12"></line>
            <line x1="10" y1="15" x2="13" y2="15"></line>
          </svg>
        </a>
      </th>
      <th style="text-align: left">Language</th>
      <th style="text-align: left">
        <span id="tagsHeaderLabel">Tags</span>
        <span id="activeTagFilter" style="display:none;vertical-align:middle;">
          <span id="activeTagName"></span><a href="#" id="clearTagFilter" style="margin-left:6px;text-decoration:none;vertical-align:middle;display:inline-flex;align-items:center;" title="Clear tag filter">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </a>
        </span>
      </th>
      <th style="text-align: left">Word count</th>
      <th style="text-align: left">Status
        <a href="/refresh_all_stats" class="refresh" title="Refresh stats for all books"></a>
      </th>
      <th style="text-align: left">
        <span id="newWordHeaderLabel">New word</span>
        <span id="activeNewWordFilter" style="display:none;vertical-align:middle;">
          <span id="activeNewWordName"></span><a href="#" id="clearNewWordFilter" style="margin-left:6px;text-decoration:none;vertical-align:middle;display:inline-flex;align-items:center;" title="Clear new word filter">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </a>
        </span>
        <a href="/refresh_all_stats" class="refresh" title="Refresh new word stats for all books"></a>
      </th>
      <th style="text-align: left">Last read</th>
      <th style="text-align: left">Actions</th>
    </tr>
  </thead>
</table>

<!-- the config widget for datatables.  Moved into the datatables table footer during setup. -->
<div id="datatables_config_widget">
  <img
    src="{{ url_for('static', filename='icn/settings-gear-icon.svg') }}"
    title="configuration"
    id="datatables_config_toggle"
    style="width: 1rem"
    />
</div>

{# Hidden form for archive, unarchive, delete. #}
<form id="actionposter" method="post" action="">
</form>

{# Status detail modal #}
<div id="statusModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;justify-content:center;align-items:center;">
  <div id="statusModal" style="background:#fff;border-radius:8px;padding:20px;min-width:320px;max-width:420px;box-shadow:0 4px 20px rgba(0,0,0,0.2);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div id="statusModalTitle" style="font-weight:bold;font-size:15px;"></div>
      <button onclick="document.getElementById('statusModalOverlay').style.display='none'"
              style="background:none;border:none;font-size:18px;cursor:pointer;color:#adb5bd;padding:0 4px;">&times;</button>
    </div>
    <div id="statusModalBody"></div>
  </div>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='vendor/dayjs/dayjs.min.js') }}" charset="utf-8"></script>
<script type="text/javascript" src="{{ url_for('static', filename='vendor/dayjs/relativeTime.js') }}" charset="utf-8"></script>
<script type="text/javascript" src="{{ url_for('static', filename='js/book-listing-shared.js') }}?v={{ lute_version }}" charset="utf-8"></script>
<script>
  var thresholds = [
  { l: 's', r: 1 },
  { l: 'm', r: 1 },
  { l: 'mm', r: 55, d: 'minute' },
  { l: 'h', r: 1 },
  { l: 'hh', r: 22, d: 'hour' },
  { l: 'd', r: 1 },
  { l: 'dd', r: 25, d: 'day' },
  { l: 'M', r: 1 },
  { l: 'MM', r: 11, d: 'month' },
  { l: 'y', r: 1 },
  { l: 'yy', d: 'year' }
  ];
  var config = {
    thresholds: thresholds
  }
  dayjs.extend(dayjs_plugin_relativeTime, config);
</script>

<script>

  /* The book listing. */
  var book_listing_table;
  function setTagFilter(tag) {
    currentTagFilter = tag || "";
    const pill = document.getElementById('activeTagFilter');
    const nameSpan = document.getElementById('activeTagName');
    const headerLabel = document.getElementById('tagsHeaderLabel');
    if (currentTagFilter) {
      if (nameSpan) nameSpan.textContent = currentTagFilter;
      if (pill) pill.style.display = 'inline-block';
      if (headerLabel) headerLabel.style.display = 'none';
    } else {
      if (pill) pill.style.display = 'none';
      if (headerLabel) headerLabel.style.display = '';
    }
    if (book_listing_table) {
      book_listing_table.draw();
    }
  }

  function setNewWordFilter(filter) {
    currentNewWordFilter = filter || "";
    const pill = document.getElementById('activeNewWordFilter');
    const nameSpan = document.getElementById('activeNewWordName');
    const headerLabel = document.getElementById('newWordHeaderLabel');
    if (currentNewWordFilter) {
      if (nameSpan) nameSpan.textContent = currentNewWordFilter;
      if (pill) pill.style.display = 'inline-block';
      if (headerLabel) headerLabel.style.display = 'none';
    } else {
      if (pill) pill.style.display = 'none';
      if (headerLabel) headerLabel.style.display = '';
    }
    if (book_listing_table) {
      book_listing_table.draw();
    }
  }

  let setup_book_datatable = function(initial_search) {
    book_listing_table = $('#booktable').DataTable({
      layout: {
        topStart: [
          function() {
            return $('#defaultLanguageSelect');
          }
        ],
        topEnd: 'search',
        bottomStart: [
          'pageLength',
          {
            info: {
              callback: function (s, start, end, max, total, result) {
                return `${start} to ${end} of ${max}`;
              }
            }
          }
        ],
        bottomEnd: 'paging'
      },
      {% if status != 'Archived' %}
      "language": {
            "emptyTable": "No books available. <a href='/book/new'>Create one?</a>"
      },
      {% endif %}
      responsive: false,
      scrollX: true,
      autoWidth: false,
      select: false,
      lengthMenu: [ 10, 25, 50, 100 ],
      pageLength: 25,
      paging: true,
      info: true,
      searching: true,
      processing: true,
      serverSide: true,
      stickyHeader: false,
      // Default sort: Last read (column 6 = LastOpenedDate), newest first.
      order: [[6, 'desc']],
      stateSave: true,
      stateDuration: 0,
      stateSaveCallback: function(settings, data) {
        data.version = 4;
        var stateJson = JSON.stringify(data);
        // Always save to localStorage as instant fallback.
        localStorage.setItem('booklisting_datatables_state', stateJson);
        // Also save to backend so it persists across browsers / computers.
        try {
          $.ajax({
            url: '/settings/datatables_state/save',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ key: 'booklisting', value: stateJson }),
            xhrFields: { withCredentials: true }
          }).fail(function() { /* swallow, localStorage already has it */ });
        } catch(e) {}
      },
      stateLoadCallback: function(settings, callback) {
        // Always prefer the local snapshot (synchronous, always reflects
        // the most recent actions in this browser).  The server copy is
        // only used as a fallback when there is no local state, so that
        // a stale server state can't resurrect a column the user hid.
        var saved = localStorage.getItem('booklisting_datatables_state');
        if (saved) {
          try {
            var ld = JSON.parse(saved);
            if (ld && ld.version === 4) {
              callback(ld);
              return;
            }
          } catch (err) { /* ignore malformed state */ }
        }
        // No local state — try the server as a fallback.
        $.ajax({
          url: '/settings/datatables_state/load/booklisting',
          method: 'GET',
          dataType: 'json',
          success: function(resp) {
            if (resp && resp.value) {
              try {
                var sd = JSON.parse(resp.value);
                if (sd && sd.version === 4) {
                  localStorage.setItem('booklisting_datatables_state', resp.value);
                  callback(sd);
                  return;
                }
              } catch (err) { /* ignore malformed state */ }
            }
            callback(null);
          },
          error: function() {
            callback(null);
          }
        });
      },
      search: { search: initial_search },
      columns: [
        { name: "BkTitle", className: "col-title", width: "28%", data: "BkTitle", render: render_book_title },
        { name: "LgName", className: "col-lang", width: "8%", data: "LgName" },
        { name: "TagList", className: "col-tags", width: "16%", data: "TagList", render: render_tag_list },
        { name: "WordCount", className: "col-words", width: "8%", data: "WordCount" },
        { name: "UnknownPercent", className: "col-status", width: "12%", data: "UnknownPercent", searchable: false, render: render_book_stats_graph_placeholder },
        { name: "NewWordPercent", className: "col-newword", width: "12%", data: "NewWordPercent", searchable: false, orderable: true, render: render_new_word_placeholder },
        { name: "LastOpenedDate", className: "col-lastread", width: "10%", data: "LastOpenedDate", searchable: false, render: render_last_opened_date },
        { name: "Actions", className: "col-actions", width: "6%", data: null, searchable: false, orderable: false, render: render_book_actions },
      ],
      createdRow: function(row, data, dataIndex) {
        if (data['SeriesTag']) {
          row.classList.add('series-row');
        }
      },
      // Load all visible rows' stats in a single batched request instead
      // of one /book/table_stats/<id> request per row. This dramatically
      // reduces DB connection-pool pressure and load on page draw.
      drawCallback: function(settings) {
        ajax_in_book_stats(settings);
      },
      initComplete: function() {
        enable_column_resize();
        // Note: ajax_in_book_stats is deliberately NOT called here — the
        // drawCallback above already fires on the initial draw, so calling
        // it here too would double every /book/table_stats request (a real
        // slowdown when stats are stale and must be recomputed).
        // DataTables 2 中，column.visible() 不会触发 drawCallback，
        // 因此需要监听 column-visibility 事件来触发统计加载。
        // 注意：必须使用 DataTables API on() 方法（不是 jQuery on），
        // 事件名不带 .dt 命名空间。
        book_listing_table.on('column-visibility', function(e, settings) {
          ajax_in_book_stats(null);
        });
      },
      ajax: {
        url: "/book/datatables/{{ status or 'active' }}",
        // Additional filters.  func calls are required to get the
        // current filter field values.  These are included in the
        // data sent to the controller.
        data: {
          filtLanguage: () => $("#defaultLanguageSelect").val(),
          filtTag: () => currentTagFilter,
          filtNewWord: () => currentNewWordFilter,
        },

        type: "POST",
        dataType: "json"
      },

    });
  } // end setup_book_datatable


  let setup_language_filter = function(current_language_id = 0) {
    const dropdown = $('#defaultLanguageSelect');
    dropdown.val(current_language_id);
    const lang_count = $("#defaultLanguageSelect option").length;
    if (lang_count == 1) {
      dropdown.css("display", "none");
    }

    dropdown.on('change', function() {
      const langid = $(this).val();
      $.post(`/settings/set/current_language_id/${langid}`);
      $('#booktable').DataTable().draw();
    });
  };


  var _pageshow_first_load = true;
  window.addEventListener('pageshow', function(e) {
    if (_pageshow_first_load) {
      _pageshow_first_load = false;
      return;
    }
    if (book_listing_table) {
      book_listing_table.ajax.reload(null, false);
    }
  });

  $(document).ready(function () {
    const current_language_id = {{ current_language_id }};
    // Language filter is set up first, because its value
    // is used during the initial datatable draw.
    setup_language_filter(current_language_id);
    setup_book_datatable("{{ initial_search or '' }}");

    // 顶部齿轮图标 — 弹出自定义列显隐菜单（不再依赖 DataTables colvis 的隐藏按钮，
    // 避免弹窗被滚动容器裁剪）。菜单用 position:fixed 定位，和 Action 菜单同一套逻辑。
    function buildColvisMenu() {
      var menu = document.getElementById('colvis-menu');
      if (!menu || !book_listing_table) return;
      menu.innerHTML = '';
      // DataTables 隐藏列时会从 DOM 中移除对应的 <th>，导致通过 DOM
      // 索引取标签名会错位。因此这里用硬编码的列名 → 标签映射，
      // 完全脱离 DOM，确保标签与列索引一一对应。
      var columnLabels = {
        BkTitle: 'Title',
        LgName: 'Language',
        TagList: 'Tags',
        WordCount: 'Word count',
        UnknownPercent: 'Status',
        NewWordPercent: 'New word',
        LastOpenedDate: 'Last read',
        Actions: 'Actions'
      };
      book_listing_table.columns().every(function() {
        var colIdx = this.index();
        // DataTables 2.0.2 的 column API 没有 .name() 方法，
        // 改用 settings().init().columns[colIdx].name 获取列名。
        var colSettings = book_listing_table.settings().init();
        var colName = colSettings.columns[colIdx].name;
        var title = columnLabels[colName] || colName;
        if (title === 'Actions') return;
        var label = document.createElement('label');
        label.className = 'colvis-item';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = this.visible();
        var span = document.createElement('span');
        span.textContent = title;
        label.appendChild(cb);
        label.appendChild(span);
        cb.addEventListener('change', function() {
          book_listing_table.column(colIdx).visible(cb.checked);
          // 直接触发统计加载，不依赖 column-visibility 事件（某些 DataTables 2 版本
          // 在 checkbox 触发的 column.visible() 调用中可能不会冒泡该事件）。
          ajax_in_book_stats(null);
        });
        menu.appendChild(label);
      });
    }

    function positionColvisMenu() {
      var menu = document.getElementById('colvis-menu');
      var gear = document.getElementById('datatables_config_widget_top');
      if (!menu || !gear) return;
      // .menu-bar 有 backdrop-filter，会使内部的 position:fixed 被限制在
      // 52px 高的顶栏内（containing block），导致菜单被“吞掉”看不到。
      // 因此把菜单重新挂到 document.body 下，确保 fixed 相对视口定位。
      if (menu.parentNode !== document.body) {
        document.body.appendChild(menu);
      }
      menu.style.display = 'block';
      var rect = gear.getBoundingClientRect();
      var menuH = menu.offsetHeight;
      var winH = window.innerHeight;
      var winW = window.innerWidth;
      var menuW = menu.offsetWidth;
      var top = rect.bottom + 6;
      if (top + menuH > winH - 8) top = rect.top - menuH - 6;
      var left = rect.left;
      if (left + menuW > winW - 8) left = winW - menuW - 8;
      menu.style.top = Math.max(4, top) + 'px';
      menu.style.left = Math.max(4, left) + 'px';
    }

    function hideColvisMenu() {
      var menu = document.getElementById('colvis-menu');
      if (menu) menu.style.display = 'none';
    }

    $(document).on('click', '#datatables_config_toggle_top', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var menu = document.getElementById('colvis-menu');
      if (menu && menu.style.display === 'block') {
        hideColvisMenu();
      } else {
        // 即使构建菜单时出错，也要保证菜单弹出来
        try { buildColvisMenu(); } catch (err) { console.error('buildColvisMenu:', err); }
        positionColvisMenu();
      }
    });

    // 点击其他区域关闭列显隐菜单（菜单被挂到 body 下，需同时识别菜单自身区域）
    $(document).on('click', function(e) {
      if (!$(e.target).closest('#datatables_config_widget_top, #colvis-menu').length) {
        hideColvisMenu();
      }
    });

    // 底栏旧齿轮保持兼容（已被隐藏，仅防意外使用）
    $("#datatables_config_toggle").click(function(e) {
      e.preventDefault();
      e.stopPropagation();
      var menu = document.getElementById('colvis-menu');
      if (menu && menu.style.display === 'block') {
        hideColvisMenu();
      } else {
        buildColvisMenu();
        positionColvisMenu();
      }
    });

    // Click clear link in header to clear tag filter
    $(document).on('click', '#clearTagFilter', function(e) {
      e.preventDefault();
      e.stopPropagation();
      setTagFilter('');
    });

    // Click clear link in header to clear new word filter
    $(document).on('click', '#clearNewWordFilter', function(e) {
      e.preventDefault();
      e.stopPropagation();
      setNewWordFilter('');
    });

  });

  /* Fetch stats for all visible rows in one batched request, instead of
     one /book/table_stats/<id> request per row. Called from drawCallback
     and initComplete. This reduces DB connection-pool pressure and load. */
  // Returns a jQuery promise/jqXHR that resolves when the stats request
  // (if any) settles, so callers can chain .always() (e.g. to stop the
  // refresh button spinner). Resolves immediately when there is nothing
  // to fetch.
  let ajax_in_book_stats = function(settings) {
    var table = book_listing_table;
    if (!table) {
      return $.Deferred().resolve();
    }

    var newWordColIdx = table.column('NewWordPercent:name').index();
    var statsColIdx = table.column('UnknownPercent:name').index();

    var newWordColVisible = table.column(newWordColIdx).visible();
    var statsColVisible = table.column(statsColIdx).visible();

    // If both the Status and New Word columns are hidden, skip the AJAX
    // call entirely — nothing would be rendered. The DataTables colvis
    // widget lets users toggle these columns off, so this guard avoids
    // a wasted batched /book/table_stats request per page redraw.
    if (!newWordColVisible && !statsColVisible) {
      return $.Deferred().resolve();
    }

    // Collect the books currently on this page and their cell nodes.
    var book_ids = [];
    var cellNodes = {};
    table.rows({ page: 'current' }).every(function(rowIdx, tableLoop, rowLoop) {
      var data = this.data();
      var bid = data['BkID'];
      if (bid === undefined || bid === null) {
        return;
      }
      book_ids.push(bid);
      cellNodes[bid] = {
        newWord: newWordColVisible ? table.cell(rowIdx, newWordColIdx).node() : null,
        stats: statsColVisible ? table.cell(rowIdx, statsColIdx).node() : null,
      };
      // Only show a skeleton when the cell has no rendered content yet.
      // Otherwise existing values stay visible while fresh stats load, so
      // a refresh that marks many books stale (slow recalc) doesn't blank
      // out the Status / New word columns.
      var needsSkeleton = function(node) {
        if (!node) return false;
        var html = node.innerHTML.trim();
        return html === '' || html.indexOf('skeleton-loading') !== -1;
      };
      if (cellNodes[bid].newWord && needsSkeleton(cellNodes[bid].newWord)) {
        $(cellNodes[bid].newWord).html(`<span class="skeleton-loading"></span>`);
      }
      if (cellNodes[bid].stats && needsSkeleton(cellNodes[bid].stats)) {
        $(cellNodes[bid].stats).html(`<span class="skeleton-loading"></span>`);
      }
    });

    if (book_ids.length === 0) {
      return $.Deferred().resolve();
    }

    return $.ajax({
      url: '/book/table_stats',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ book_ids: book_ids }),
      success: function(response) {
        Object.keys(response).forEach(function(bid) {
          var nodes = cellNodes[bid];
          if (!nodes) {
            return;
          }
          var stats = response[bid];
          try {
            if (nodes.stats) {
              $(nodes.stats).removeClass("refreshed");
              if (stats.status_distribution) {
                const result = JSON.parse(stats.status_distribution);
                const graph = render_stats_graph(result);
                $(nodes.stats).html(graph);
              } else {
                $(nodes.stats).text('No data');
              }
            }
            if (nodes.newWord) {
              $(nodes.newWord).removeClass("refreshed");
              const newWordHtml = render_new_word(
                stats.new_word_percent,
                stats.difficulty_label,
                stats.difficulty_color,
                stats.difficulty_description
              );
              $(nodes.newWord).html(newWordHtml);
            }
          } catch (e) {
            console.error('table_stats error for book ' + bid + ':', e);
            if (nodes.stats) {
              $(nodes.stats).text('Error loading data');
              $(nodes.stats).removeClass("refreshed");
            }
            if (nodes.newWord) {
              $(nodes.newWord).text('Error');
              $(nodes.newWord).removeClass("refreshed");
            }
          }
        });
      },
      error: function() {
        book_ids.forEach(function(bid) {
          var nodes = cellNodes[bid];
          if (!nodes) {
            return;
          }
          if (nodes.stats) {
            $(nodes.stats).html('<span class="skeleton-loading"></span>');
            $(nodes.stats).removeClass("refreshed");
          }
          if (nodes.newWord) {
            $(nodes.newWord).html('<span class="skeleton-loading"></span>');
            $(nodes.newWord).removeClass("refreshed");
          }
        });
      }
    });
  };

  // added class is used for changing static image to rotating arrow animation
  // The refresh <a> must not navigate (no default action): navigating to
  // /refresh_all_stats reloads the whole page and leaves every stats cell
  // on a skeleton while all books re-calculate.  Instead mark all books
  // stale via AJAX, then reload the visible stats columns in place.
  $(document).on('click', 'a.refresh', function(e) {
    e.preventDefault();
    e.stopPropagation();
    $(e.currentTarget).addClass('refreshed');
    if (!book_listing_table) return;
    $.ajax({
      url: '/refresh_all_stats',
      method: 'POST',
      success: function() {
        // Don't redraw the table: a draw re-fetches the rows from the
        // server, and since every book was just marked stale the server
        // returns rows with no status data, which would blank the Status
        // and New word columns during the slow recalc. Instead reload the
        // stats for the current page in place, keeping the existing values
        // visible until fresh ones arrive.
        var req = ajax_in_book_stats(null);
        // Stop the spinner once the stats request settles.
        $.when(req).always(function() {
          $(e.currentTarget).removeClass('refreshed');
        });
      }
    });
  });

  /**
   * Clearing the state is required for acceptance tests,
   * because otherwise state is accidentally applied to
   * following tests, messing up test results.
   * I tried various things such as setting and clearing
   * the filter input box, but this was the only method
   * that worked reliably.
   * This is called from the lute_test_client.py.
   */
  function clear_datatable_state() {
