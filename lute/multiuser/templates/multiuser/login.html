<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - Song</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1b26;
      color: #c0caf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      background: #24283b;
      border: 1px solid #414868;
      border-radius: 10px;
      padding: 40px 44px;
      width: 300px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .login-card h1 {
      text-align: center;
      font-size: 26px;
      margin: 0 0 6px;
      color: #7aa2f7;
    }
    .login-card p.sub {
      text-align: center;
      font-size: 13px;
      color: #565f89;
      margin: 0 0 24px;
    }
    .login-card label {
      display: block;
      font-size: 13px;
      margin: 12px 0 4px;
      color: #a9b1d6;
    }
    .login-card input[type="text"],
    .login-card input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      border: 1px solid #414868;
      border-radius: 6px;
      background: #1a1b26;
      color: #c0caf5;
      font-size: 14px;
    }
    .login-card input:focus {
      outline: none;
      border-color: #7aa2f7;
    }
    .login-card button {
      width: 100%;
      margin-top: 22px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #7aa2f7;
      color: #1a1b26;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-card button:hover { background: #89b4fa; }
    .flash-error {
      background: #f7768e22;
      border: 1px solid #f7768e;
      color: #f7768e;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Song</h1>
    <p class="sub">Log in to continue</p>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="flash-error">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username" />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
