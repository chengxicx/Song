{% extends 'base.html' %}

{% block title %}Change password{% endblock %}

{% block header %}{% if target %}Change password: {{ target }}{% else %}Change your password{% endif %}{% endblock %}

{% block body %}

<form method="POST" style="max-width: 360px;">

  {% if target %}
  <label for="password">New password</label><br/>
  <input type="password" id="password" name="password" required
         style="width:100%;padding:7px 9px;" autofocus /><br/><br/>
  {% else %}
  <label for="current">Current password</label><br/>
  <input type="password" id="current" name="current" required
         style="width:100%;padding:7px 9px;" autofocus /><br/><br/>

  <label for="password">New password</label><br/>
  <input type="password" id="password" name="password" required
         style="width:100%;padding:7px 9px;" /><br/><br/>
  {% endif %}

  <label for="confirm">Confirm new password</label><br/>
  <input type="password" id="confirm" name="confirm" required
         style="width:100%;padding:7px 9px;" /><br/><br/>

  <button type="submit" style="padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;">Save</button>
  <a href="{{ '/users/index' if target else '/' }}" style="margin-left: 10px;">Cancel</a>
</form>

{% endblock %}
