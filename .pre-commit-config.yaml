# pre-commit config, per https://pre-commit.com/
#
# These hooks only use local commands.

fail_fast: true

repos:
  - repo: local
    hooks:
    - id: black
      name: black
      # The venv binary, so the hook works from any shell (PATH need not
      # have the venv activated; language:system would only find black
      # when it does).
      entry: venv/bin/black
      language: system
      types: [python]
      require_serial: true
