[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "lute_cantonese_parser"

[project]
name = "lute3-cantonese"
dynamic = ['version']
description = "Learning Using Texts - Cantonese Parser"
requires-python = ">=3.8"
authors = [
  {name = "chengxicn"}
]
readme = "README_PyPi.md"

dependencies = [
  "lute3>=3.4.2",
  "pycantonese>=3.4.0"
]


[project.entry-points."lute.plugin.parse"]
lute_cantonese = "lute_cantonese_parser.parser:CantoneseParser"
