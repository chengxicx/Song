[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "lute_korean_parser"

[project]
name = "lute3-korean"
dynamic = ['version']
description = "Learning Using Texts - Korean Parser"
requires-python = ">=3.8"
authors = [
  {name = "chengxicn"}
]
readme = "README_PyPi.md"

dependencies = [
  "lute3>=3.4.2",
  "kiwipiepy>=0.15.0"
]


[project.entry-points."lute.plugin.parse"]
lute_korean = "lute_korean_parser.parser:KoreanParser"
